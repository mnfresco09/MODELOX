# ============================================================================
# MODELOX QUANT STATION - DOCKER COMPOSE v2.0
# Ejecutar desde app/: docker compose up -d
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # NGINX - REVERSE PROXY
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: modelox-proxy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../resultados:/app/resultados:ro
    depends_on:
      - backend
      - frontend
    networks:
      - modelox-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # BACKEND - FastAPI
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: app/backend/Dockerfile
    container_name: modelox-backend
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MODELOX_ENV=${MODELOX_ENV:-production}
    volumes:
      - ../modelox:/app/modelox:ro
      - ../general:/app/general:ro
      - ../visual:/app/visual:ro
      - ../data:/app/data:ro
      - ../resultados:/app/resultados
      - ../ejecutar.py:/app/ejecutar.py:ro
    networks:
      - modelox-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # FRONTEND - React + Vite
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: app/frontend/Dockerfile
    container_name: modelox-frontend
    networks:
      - modelox-network
    restart: unless-stopped

networks:
  modelox-network:
    driver: bridge

volumes:
  resultados:
